[package]
name = "pwe-karaoke"
version = "1.0.0"
edition = "2021"
authors = ["AEUG"]
description = "Desktop karaoke application with vocal separation using Spleeter"
license = "BSD-3-Clause"
repository = "https://github.com/Ciztek/pwe"
keywords = ["karaoke", "audio", "music", "lyrics", "player"]
categories = ["multimedia::audio", "gui"]

[package.metadata.bundle]
name = "PWE Karaoke"
identifier = "com.ciztek.pwe-karaoke"
icon = ["assets/icon.png"]
version = "1.0.0"
copyright = "Copyright (c) 2026 Ciztek"
category = "Music"
short_description = "Desktop karaoke application"
long_description = "Desktop karaoke application with audio playback, library management, and vocal separation capabilities."

[dependencies]
# GUI Framework - Using eframe (egui) for desktop UI
eframe = "0.29"
egui = "0.29"
egui_extras = "0.29"

# Audio playback and processing
rodio = "0.19"
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"

# Python integration for Spleeter (optional for cross-compilation)
pyo3 = { version = "0.22", features = ["auto-initialize"], optional = true }

# File handling and async runtime
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = "0.4"

# HTTP client and OAuth
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
oauth2 = "4.4"
url = "2.5"
base64 = "0.22"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# File dialogs
rfd = "0.15"

# Image processing for album art
image = "0.25"

# Path handling
walkdir = "2.5"

# utilities
dirs = "5.0"
enum_cycling = "0.1"
regex = "1"

[features]
default = []
spleeter = ["pyo3"]
custom-font = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Clippy lints configuration - STRICT MODE
[lints.clippy]
# ===== DENY: Critical issues that must be fixed =====
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

# ===== WARN: Best practices and code quality =====
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# ===== ALLOW: Unavoidable ecosystem issues =====
# Multiple dependency versions are common due to transitive dependencies
# and are generally harmless unless they cause actual conflicts
multiple_crate_versions = "allow"

# ===== SPECIFIC STRICT LINTS =====
# Unwraps and panics
expect_used = "warn"
unwrap_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"

# Memory and performance
large_enum_variant = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
redundant_clone = "warn"
cloned_instead_of_copied = "warn"

# Error handling
map_unwrap_or = "warn"
result_large_err = "warn"

# Code quality
cognitive_complexity = "warn"
too_many_lines = "warn"
needless_pass_by_value = "warn"
unnecessary_wraps = "warn"
unused_self = "warn"

# Documentation
missing_docs_in_private_items = "allow"  # Too verbose, but consider enabling
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# Safety and correctness
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
float_cmp = "warn"

# Code style consistency
module_name_repetitions = "allow"  # Common pattern in Rust
similar_names = "allow"  # Can be too strict
too_many_arguments = "warn"  # Changed from allow
single_match_else = "allow"  # Can be more readable
match_bool = "warn"

# String handling
string_add = "warn"
string_add_assign = "warn"

# Use of std::process::exit
exit = "warn"

# Regex
invalid_regex = "deny"

# ===== Rust 2021/2024 idioms =====
redundant_field_names = "warn"
redundant_static_lifetimes = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
